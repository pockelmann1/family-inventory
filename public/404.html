<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Family Inventory</title>
<script>
  // GitHub Pages shows this page for any unknown address. Some email apps
  // rewrite a link's "#" as "%23", which lands here; pull the key back out and
  // go to the real site. Anything else goes to the site's front page.
  var s = location.pathname + location.search + location.hash;
  try { s = decodeURIComponent(decodeURIComponent(s)); } catch (e) {}
  var m = s.match(/k=([A-Za-z0-9_-]{20,})/);
  location.replace('/family-inventory/' + (m ? '?k=' + m[1] : ''));
</script>
</head>
<body style="font-family: Georgia, serif; text-align: center; padding-top: 20vh">
  <p><a href="/family-inventory/">Family Inventory</a></p>
</body>
</html>
