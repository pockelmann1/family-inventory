name: Photos and keep-alive

# Moves newly staged photos into private storage, refreshes the week-long
# signed photo links, and pings Supabase so the free project never pauses.
on:
  schedule:
    - cron: '17 9 * * *'
  push:
    branches: [main]
    paths:
      - scripts/photos.mjs
      - scripts/photos-run.txt
      - .github/workflows/photos.yml
  workflow_dispatch:

concurrency: photos

permissions:
  contents: read
  actions: write # only to keep this scheduled job switched on (last step)

env:
  SUPABASE_PROJECT_REF: joclsntnnmtzzeippxhp
  SUPABASE_URL: https://joclsntnnmtzzeippxhp.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_l1slwkNY7ofygcwQWt4QrA_-FazT4jv

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Keep Supabase awake
        run: |
          curl -fsS -o /dev/null -X POST "$SUPABASE_URL/rest/v1/rpc/fi_ping" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" -d '{}'
      - name: Find database connection
        run: scripts/pg-env.sh
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Move photos and refresh links
        run: node scripts/photos.mjs
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Keep this daily job switched on
        # GitHub switches off scheduled jobs in a repository with no changes
        # for 60 days. Re-enabling it each run keeps photo links and the
        # keep-alive ping going even when nobody touches the code.
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/photos.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
